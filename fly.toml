# Конфигурация для развёртывания на Fly.io
app = "our-plans-sync"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  INVITE_SECRET = "ny2027-friends"
  DATA_DIR = "/data"

[mounts]
  source = "crdt_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
